[package]
name = "xray-qbrute"
edition = "2024"

[dependencies]
sha2 = "0.11.0"
rayon = "1"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1.0.1"
wgpu = { version = "30.0.0", default-features = false, features = ["std", "vulkan", "metal", "wgsl"] }
indicatif = "0.18.6"
hex = "0.4"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
