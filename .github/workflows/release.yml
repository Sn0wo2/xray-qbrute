name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.1.1)
        required: true
        type: string
      snapshot:
        description: Build a snapshot without bumping, tagging, or publishing
        type: boolean

permissions: {}

concurrency:
  group: release-${{ inputs.snapshot && format('snapshot-{0}', github.ref) || 'publish' }}
  cancel-in-progress: ${{ inputs.snapshot == true }}

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
    outputs:
      skip: ${{ steps.release.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      sha: ${{ steps.commit.outputs.sha || steps.metadata.outputs.sha }}
      has_binaries: ${{ steps.metadata.outputs.has_binaries }}
      has_publishable_crates: ${{ steps.metadata.outputs.has_publishable_crates }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ (github.event_name == 'push' || inputs.snapshot) && github.ref || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Normalize version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          version=${RELEASE_VERSION#v}
          if [[ $version != [0-9]* || $(npm exec --yes --package=semver@7 -- semver "$version") != "${version%%+*}" ]]; then
            echo "Invalid semantic version: $RELEASE_VERSION" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [[ ${version%%+*} != *-* ]] || echo "prerelease=true" >> "$GITHUB_OUTPUT"

      - name: Check for an already published release
        id: release
        if: ${{ !inputs.snapshot }}
        run: node scripts/check-release.js "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}

      - name: Resume an existing release tag
        id: tag
        if: github.event_name == 'workflow_dispatch' && !inputs.snapshot && steps.release.outputs.skip != 'true'
        run: |
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            git checkout --detach "v$VERSION"
            echo "retry=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.release.outputs.skip != 'true'
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        if: steps.release.outputs.skip != 'true'
        with:
          shared-key: check
          cache-workspace-crates: true
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - uses: taiki-e/install-action@v2
        if: ${{ !inputs.snapshot && steps.release.outputs.skip != 'true' }}
        with:
          tool: cargo-edit

      - name: Sync workspace version
        id: sync
        if: ${{ !inputs.snapshot && steps.release.outputs.skip != 'true' }}
        run: |
          cargo set-version --workspace "$VERSION"
          if ! git diff --quiet -- '*Cargo.toml' Cargo.lock; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect release metadata
        id: metadata
        if: steps.release.outputs.skip != 'true'
        run: node scripts/collect-release-metadata.js
        env:
          VERIFY_VERSION: ${{ !inputs.snapshot }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Reuse CI checks for this commit
        if: github.event_name == 'push' && steps.release.outputs.skip != 'true' && steps.sync.outputs.changed != 'true'
        timeout-minutes: 15
        uses: lewagon/wait-on-check-action@v1.9.1
        with:
          ref: ${{ steps.metadata.outputs.sha }}
          check-name: Checks
          repo-token: ${{ github.token }}
          allowed-conclusions: success

      - name: Check the release candidate
        if: steps.release.outputs.skip != 'true' && (github.event_name == 'workflow_dispatch' || steps.sync.outputs.changed == 'true')
        run: |
          cargo fmt-check
          cargo lint
          cargo check-ws
          cargo check-no-default
          cargo test-ws
          cargo test-all-features
          cargo test-no-default
          cargo doc-all

      - uses: EmbarkStudios/cargo-deny-action@v2
        if: steps.release.outputs.skip != 'true' && (github.event_name == 'workflow_dispatch' || steps.sync.outputs.changed == 'true')

      - name: Commit and publish the checked version
        id: commit
        if: ${{ !inputs.snapshot && steps.release.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u -- '*Cargo.toml' Cargo.lock
          if git diff --cached --quiet && git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --quiet || git commit -m "chore(release): bump version to $VERSION"
          release_sha=$(git rev-parse HEAD)
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            git fetch origin "$DEFAULT_BRANCH"
            git checkout --detach FETCH_HEAD
            git cherry-pick "$release_sha"
            git -c credential.helper='!gh auth git-credential' push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          else
            git tag "v$VERSION"
            git -c credential.helper='!gh auth git-credential' push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/v$VERSION"
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.has_binaries == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-windows
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu,x86_64-pc-windows-gnu,aarch64-unknown-linux-gnu,armv7-unknown-linux-gnueabihf
            artifacts: |
              dist/*.tar.gz
              dist/*.zip
          - platform: macos
            os: macos-latest
            targets: x86_64-apple-darwin,aarch64-apple-darwin
            artifacts: dist/*_darwin_*.tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/build
        with:
          version: ${{ needs.prepare.outputs.version }}
          snapshot: ${{ inputs.snapshot == true && 'true' || 'false' }}
          platform: ${{ matrix.platform }}
          targets: ${{ matrix.targets }}
          artifacts: ${{ matrix.artifacts }}

  wasm:
    name: WebAssembly browser build
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.has_binaries == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-web
          workspaces: '. -> target'

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Build browser packages
        run: node scripts/build.ts wasm

      - name: Verify browser artifact
        run: node scripts/build.ts verify

  publish:
    needs: [prepare, build, wasm]
    if: >-
      !cancelled() && !inputs.snapshot && needs.prepare.result == 'success' &&
      needs.prepare.outputs.skip != 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        if: needs.prepare.outputs.has_publishable_crates == 'true'

      - uses: Swatinem/rust-cache@v2
        if: needs.prepare.outputs.has_publishable_crates == 'true'
        with:
          shared-key: check
          cache-workspace-crates: true
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - uses: katyo/publish-crates@v2
        if: needs.prepare.outputs.has_publishable_crates == 'true'
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          args: --allow-dirty

      - uses: actions/download-artifact@v8
        if: needs.prepare.outputs.has_binaries == 'true'
        with:
          pattern: ${{ github.event.repository.name }}-*-builds
          merge-multiple: true
          path: dist

      - name: Generate checksums
        if: needs.prepare.outputs.has_binaries == 'true'
        working-directory: dist
        run: |
          shopt -s nullglob
          files=(*.tar.gz *.zip)
          ((${#files[@]}))
          sha256sum -- "${files[@]}" > checksums.txt

      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release --skip=before,archive,validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_PLATFORM: release

  container:
    needs: [prepare, build, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: container-binaries

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=v${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease != 'true' }}
            type=raw,value=beta-latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container,ignore-error=true
