[package]
name = "xray-qbrute-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "xray_qbrute"
crate-type = ["cdylib"]

[features]
default = []
wasm-controller = [
  "dep:wasm-bindgen-futures",
  "dep:futures-channel",
  "dep:wasm-bindgen-rayon",
  "dep:rayon",
  "dep:hex",
  "dep:uuid",
  "dep:serde-wasm-bindgen",
  "dep:serde",
  "dep:js-sys",
  "dep:web-sys",
]
wasm-webgpu = ["wasm-controller", "dep:wgpu", "dep:bytemuck"]
wasm-simd = ["xray-qbrute-core/wasm-simd"]

[dependencies]
xray-qbrute-core = { path = "../core", default-features = false }
bytemuck = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
wasm-bindgen.workspace = true
console_error_panic_hook.workspace = true
serde = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
  "DedicatedWorkerGlobalScope",
  "console",
  "MessageEvent",
  "Performance",
  "WorkerGlobalScope",
] }
wasm-bindgen-futures = { workspace = true, optional = true }
futures-channel = { workspace = true, optional = true }
wgpu = { workspace = true, features = ["std", "webgpu", "wgsl"], optional = true }
wasm-bindgen-rayon = { workspace = true, optional = true }
rayon = { workspace = true, features = ["web_spin_lock"], optional = true }

[lints]
workspace = true
