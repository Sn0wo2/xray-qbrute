[package]
name = "xray-qbrute-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "xray-qbrute"
path = "src/main.rs"
doc = false

[dependencies]
xray-qbrute-core = { path = "../core", default-features = false }
acta = { workspace = true, features = ["file"] }
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
indicatif.workspace = true
num-format.workspace = true
hex.workspace = true
uuid.workspace = true
rayon.workspace = true
ctrlc = "3.5.2"

[build-dependencies]
acta-build.workspace = true

[features]
default = ["scalar", "avx2", "wgpu", "cuda"]
scalar = ["xray-qbrute-core/scalar"]
avx2 = ["xray-qbrute-core/avx2"]
wgpu = ["xray-qbrute-core/wgpu"]
cuda = ["xray-qbrute-core/cuda"]

[lints]
workspace = true
