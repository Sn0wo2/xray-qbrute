[alias]
fmt-all = "fmt --all"
fmt-check = "fmt --all -- --check"
check-ws = "check --workspace --all-targets"
check-all-features = "check --workspace --all-targets --all-features"
check-no-default = "check --workspace --all-targets --no-default-features --features scalar"
lint = "clippy --workspace --all-targets --all-features -- -D warnings"
lint-fix = "clippy --workspace --all-targets --all-features --fix --allow-dirty --allow-staged"
test-ws = "test --workspace"
test-all-features = "test --workspace --all-features"
test-no-default = "test --workspace --no-default-features --features scalar"
doc-all = "doc --workspace --no-deps --all-features"
security = "deny check"
build-ws = "build --workspace"
publish-dry = "publish --dry-run --allow-dirty"

[env]
RUSTDOCFLAGS = "-D warnings"

[target.wasm32-unknown-unknown]
rustflags = [
  "-C",
  "target-feature=+atomics,+bulk-memory",
  "-C",
  "link-arg=--shared-memory",
  "-C",
  "link-arg=--max-memory=1073741824",
  "-C",
  "link-arg=--import-memory",
  "-C",
  "link-arg=--export=__heap_base",
  "-C",
  "link-arg=--export=__wasm_init_tls",
  "-C",
  "link-arg=--export=__tls_size",
  "-C",
  "link-arg=--export=__tls_align",
  "-C",
  "link-arg=--export=__tls_base",
]

[unstable]
#build-std = ["panic_abort", "std"]
